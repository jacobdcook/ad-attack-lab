title: RC4 service ticket request (Kerberoasting building block)
id: b2a077f2-905b-4c35-acca-fe54775c6797
name: rc4_tgs_request
status: experimental
description: One TGS request for a user service account with weak RC4 encryption. Alone this is normal; the correlation below alerts on many distinct services from one source.
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4769
    TicketEncryptionType: '0x17'   # RC4-HMAC, weak; attackers force this to crack offline
  filter_krbtgt:
    ServiceName|startswith: 'krbtgt'
  filter_machine:
    ServiceName|endswith: '$'      # machine accounts, not Kerberoast targets
  condition: selection and not filter_krbtgt and not filter_machine
falsepositives:
  - Vulnerability scanners enumerating SPNs
  - Legacy applications still using RC4
level: low
tags:
  - attack.credential-access
  - attack.t1558.003
