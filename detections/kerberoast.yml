title: Potential Kerberoasting via Service Ticket Requests
id: 84e45c46-a833-448a-9de1-5384487134f6
status: experimental
description: More than five distinct user service accounts requested with RC4 from one source in five minutes, the signature of Kerberoasting.
correlation:
  type: value_count
  rules:
    - rc4_tgs_request
  group-by:
    - IpAddress
  timespan: 5m
  condition:
    field: ServiceName
    gt: 5
falsepositives:
  - Vulnerability scanners enumerating SPNs
  - Legacy applications still using RC4
level: high
tags:
  - attack.credential-access
  - attack.t1558.003
