# BloodHound Community Edition — graph the AD attack paths SharpHound collects.
# Bring up:   docker compose -f bloodhound/docker-compose.yml up -d
# Web UI:     http://localhost:8080   (first-run creds printed in logs, see README)
# Reset pw:   docker compose logs bloodhound | grep -i "Initial"
# Tear down:  docker compose -f bloodhound/docker-compose.yml down   (add -v to wipe data)
services:
  app-db:
    image: postgres:16
    environment:
      POSTGRES_USER: bloodhound
      POSTGRES_PASSWORD: bloodhoundcommunityedition
      POSTGRES_DB: bloodhound
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bloodhound -d bloodhound -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  graph-db:
    image: neo4j:4.4
    environment:
      NEO4J_AUTH: neo4j/bloodhoundcommunityedition
      NEO4J_dbms_allow__upgrade: "true"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -O /dev/null -q http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  bloodhound:
    image: specterops/bloodhound:latest
    environment:
      bhe_disable_cypher_complexity_limit: "true"
      bhe_database_connection: "user=bloodhound password=bloodhoundcommunityedition dbname=bloodhound host=app-db"
      bhe_neo4j_connection: "neo4j://neo4j:bloodhoundcommunityedition@graph-db:7687/"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      app-db:
        condition: service_healthy
      graph-db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  neo4j-data:
